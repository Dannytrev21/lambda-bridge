sns_topic_arn: "arn:aws:sns:us-east-1:123456789012:lambda-bridge-qa"
debug: false
cloud_webhook_urls:
  - "https://qa.lambda-bridge.example.com/webhooks/cloud-primary"
  - "https://qa.lambda-bridge.example.com/webhooks/cloud-secondary"
enterprise_webhook_urls:
  - "https://qa.lambda-bridge.example.com/webhooks/enterprise-primary"
worker_count: 25
queue_size: 200
max_retries: 3
enable_jitter: true
base_retry_delay_ms: 100
max_retry_delay_seconds: 5
circuit_breaker_fail_threshold: 5
circuit_breaker_window_seconds: 30
circuit_breaker_cooldown_seconds: 30
webhook_timeout_ms: 10000
